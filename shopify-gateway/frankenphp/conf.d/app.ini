; Production PHP settings for the Shopify OAuth gateway.
expose_php = 0
memory_limit = 128M

; Requests are short (a few Shopify Admin API calls at most); keep the default
; ceiling rather than disabling it, so a hung upstream cannot pin a worker.
max_execution_time = 30

; The Shopify Admin API is reached with file_get_contents() over HTTPS.
allow_url_fopen = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 5000
opcache.validate_timestamps = 0
opcache.interned_strings_buffer = 8

realpath_cache_size = 4096K
realpath_cache_ttl = 600
