framework:
    cache:
        prefix_seed: "%env(APP_VERSION)%"
        app: cache.adapter.redis
        default_redis_provider: "snc_redis.default"
        pools:
            twig.cache:
                adapter: cache.app
            s3_flysystem.cache:
                adapter: cache.app
            tag_manager.cache:
                adapters:
                  - cache.adapter.array
                  - cache.app
            craue_config.cache:
                adapters:
                  - cache.adapter.array
                  - cache.app
            foodtech.cache:
                adapters:
                  - cache.adapter.array
                  - cache.app
            # The scheduler's own state (when each recurring message last ran),
            # so a worker restart doesn't lose what was due. Redis-backed and
            # never array-backed: it has to survive the process.
            scheduler.cache:
                adapter: cache.app
            version.cache:
                default_lifetime: 3600
                adapters:
                  - cache.adapter.array
                  - cache.app
