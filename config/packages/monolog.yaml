monolog:
  # channels to use with autowire; https://symfony.com/doc/current/logging/channels_handlers.html#how-to-autowire-logger-channels
  channels:
    [
      'deprecation',
      'domain_event',
      'checkout',
      'database',
      'fee_calculation',
      'push_notification',
      'real_time_message',
      'transporter',
      'zelty',
    ]

  handlers:
    # Zelty API traffic is persisted so it can be reviewed from the admin UI
    zelty_api_log:
      type: service
      id: AppBundle\Monolog\ZeltyApiLogHandler
      channels: [ zelty ]
