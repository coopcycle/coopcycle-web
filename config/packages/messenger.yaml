framework:
    messenger:
        default_bus: event.bus
        buses:
            command.bus:
                default_middleware: true
                # https://symfony.com/doc/current/messenger.html#middleware-for-doctrine
                middleware:
                    # service ids that implement Symfony\Component\Messenger\Middleware\MiddlewareInterface
                    # Holds the messages bound for a transport until the
                    # transaction they are about commits; must come first
                    - 'AppBundle\Messenger\TransactionalMessagesMiddleware'
                    - 'AppBundle\Messenger\MockDateMiddleware'
                    - 'AppBundle\Messenger\RequestContextMiddleware'
                    # each time a message is handled, the Doctrine connection
                    # is "pinged" and reconnected if it's closed. Useful
                    # if your workers run for a long time and the database
                    # connection is sometimes lost
                    - doctrine_ping_connection
                    # After handling, the Doctrine connection is closed,
                    # which can free up database connections in a worker,
                    # instead of keeping them open forever
                    - doctrine_close_connection
            event.bus:
                default_middleware: true
                # https://symfony.com/doc/current/messenger.html#middleware-for-doctrine
                middleware:
                    # service ids that implement Symfony\Component\Messenger\Middleware\MiddlewareInterface
                    # Holds the messages bound for a transport until the
                    # transaction they are about commits; must come first
                    - 'AppBundle\Messenger\TransactionalMessagesMiddleware'
                    - 'AppBundle\Messenger\RenderEmailMiddleware'
                    - 'AppBundle\Messenger\RequestContextMiddleware'
                    - 'AppBundle\Messenger\EventStoreMiddleware'
                    # each time a message is handled, the Doctrine connection
                    # is "pinged" and reconnected if it's closed. Useful
                    # if your workers run for a long time and the database
                    # connection is sometimes lost
                    - doctrine_ping_connection
                    # After handling, the Doctrine connection is closed,
                    # which can free up database connections in a worker,
                    # instead of keeping them open forever
                    - doctrine_close_connection
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#redis-transport
            #
            # When running multiple multiple Redis consumers, you may have error:
            # "Could not acknowledge redis message"
            #
            # This is because each Redis consumer must be unique.
            # Make sure to pass a DSN with a unique consumer name for each process.
            #
            # redis://localhost:6379/<stream>/<group>/<name>
            #
            # https://github.com/symfony/symfony/issues/35358
            # https://github.com/symfony/symfony-docs/pull/11869
            # https://github.com/symfony/symfony-docs/pull/14888
            #
            async:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
            # For the messages a worker handles right away, rather than put them in line
            # behind the job it is busy with, see LiveUpdates::publish()
            sync:
                dsn: 'sync://'
            # Not the async stream: the worker would consume the failed messages
            # again, then drop them. In the database, they can be listed and
            # replayed with messenger:failed:show / messenger:failed:retry.
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    # Nothing consumes it continuously, no need for LISTEN/NOTIFY
                    use_notify: false
        routing:
            'AppBundle\Message\CalculateRoute': async
            'AppBundle\Message\DeliveryCreated': async
            'AppBundle\Message\DeliveriesCreated': async
            'AppBundle\Message\DeliveryUpdated': async
            'AppBundle\Message\DeliveryCancelled': async
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async
            'AppBundle\Message\PushNotification': async
            'AppBundle\Message\ImportTasks': async
            'AppBundle\Message\OrderReceiptEmail': async
            'AppBundle\Message\Sms': async
            'AppBundle\Message\UpdateLocation': async
            'AppBundle\Message\TopBarNotification': async
            'AppBundle\Message\Webhook': async
            'AppBundle\Message\IndexDeliveries': async
            'AppBundle\Message\WoopitDocumentWebhook': async
            'AppBundle\Message\ImportDeliveries': async
            'AppBundle\Message\CancelImportedDeliveries': async
            'AppBundle\Message\CopyProducts': async
            'AppBundle\Message\GenerateOrdersForDate': async
            'AppBundle\Message\Order\ProcessOrderAfterTaskCancellation': async
            'AppBundle\Message\EnableProduct': async
            'AppBundle\Message\ResetRushMode': async
            'AppBundle\Message\SoftDelete\CleanupProductOption': async
            'AppBundle\Message\PublishToCentrifugo': async
            'AppBundle\Message\Zelty\PushOrder': async
            'AppBundle\Message\Zelty\ProcessZeltyCatalog': async
            'AppBundle\Message\RdcMessage': async
            'AppBundle\Message\Marketing\SendCampaignEmail': async
            # Moving money to a restaurant involves a Stripe round trip and
            # may have to wait for the platform balance, so it must not be
            # done inside the webhook that triggers it: a slow handler makes
            # Stripe retry, and a retried webhook is how vendors came to be
            # paid twice.
            'AppBundle\Message\GiftCard\SettleGiftCardOrder': async
            'AppBundle\Message\GiftCard\GiftCardIssued': async
            'AppBundle\Message\IncidentRdcMessage': async
            # They call the BOL, which must neither slow down nor fail the
            # task update that sent them
            'AppBundle\Message\RdcPickupStatusUpdateMessage': async
            'AppBundle\Message\RdcDropoffStatusUpdateMessage': async
