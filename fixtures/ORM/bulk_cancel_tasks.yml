include:
  - address_client_1.yml

AppBundle\Entity\Task:
  task_1:
    type: 'PICKUP'
    status: 'TODO'
    doneAfter: <identity(new \DateTime('today 10:30:00'))>
    doneBefore: <identity(new \DateTime('today 11:30:00'))>
    address: "@address_client_1"
  task_2:
    type: 'DROPOFF'
    status: 'TODO'
    doneAfter: <identity(new \DateTime('today 11:30:00'))>
    doneBefore: <identity(new \DateTime('today 12:30:00'))>
    address: "@address_client_1"
  task_3:
    type: 'PICKUP'
    status: 'TODO'
    doneAfter: <identity(new \DateTime('today 10:30:00'))>
    doneBefore: <identity(new \DateTime('today 11:30:00'))>
    address: "@address_client_1"
  task_4:
    type: 'DROPOFF'
    status: 'TODO'
    doneAfter: <identity(new \DateTime('today 11:30:00'))>
    doneBefore: <identity(new \DateTime('today 12:30:00'))>
    address: "@address_client_1"

AppBundle\Entity\Delivery:
  delivery_1:
    __factory:
      createWithTasks:
        - '@task_1'
        - '@task_2'
  delivery_2:
    __factory:
      createWithTasks:
        - '@task_3'
        - '@task_4'

AppBundle\Entity\Sylius\Order:
  order_1:
    __factory:
      '@sylius.factory.order::createForDelivery':
        - "@delivery_1"
    __calls:
      - setNumber: [ "A1" ]
      - setState: [ 'new' ]
  # An order that was never checked out, it can't be cancelled
  order_2:
    __factory:
      '@sylius.factory.order::createForDelivery':
        - "@delivery_2"
    __calls:
      - setNumber: [ "A2" ]
      - setState: [ 'cart' ]
