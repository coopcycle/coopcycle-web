AppBundle\Entity\GiftCard\GiftCard:
  gift_card_active:
    code: 'ACTIVE234CARD'
    currencyCode: 'EUR'
    livemode: false
    initialAmount: 5000
    balance: 5000
    state: 'active'
    funding: 'funded'
    purchaserEmail: 'buyer@coopcycle.org'
    recipientEmail: 'recipient@coopcycle.org'
    purchaseChargeId: 'ch_gift_card_active'
    issuedAt: '<(new \DateTime())>'
  gift_card_small:
    code: 'SMALL2345CARD'
    currencyCode: 'EUR'
    livemode: false
    initialAmount: 500
    balance: 500
    state: 'active'
    funding: 'funded'
    purchaserEmail: 'buyer@coopcycle.org'
    purchaseChargeId: 'ch_gift_card_small'
    issuedAt: '<(new \DateTime())>'
  gift_card_depleted:
    code: 'SPENT2345CARD'
    currencyCode: 'EUR'
    livemode: false
    initialAmount: 2000
    balance: 0
    state: 'depleted'
    funding: 'funded'
    purchaserEmail: 'buyer@coopcycle.org'
    purchaseChargeId: 'ch_gift_card_depleted'
    issuedAt: '<(new \DateTime())>'
  gift_card_expired:
    code: 'OLDCARD23456'
    currencyCode: 'EUR'
    livemode: false
    initialAmount: 2000
    balance: 2000
    state: 'active'
    funding: 'funded'
    purchaserEmail: 'buyer@coopcycle.org'
    purchaseChargeId: 'ch_gift_card_expired'
    expiresAt: '<(new \DateTime("-1 day"))>'
    issuedAt: '<(new \DateTime("-2 years"))>'

AppBundle\Entity\GiftCard\GiftCardTransaction:
  gift_card_transaction_active:
    giftCard: '@gift_card_active'
    type: 'purchase'
    amount: 5000
  gift_card_transaction_small:
    giftCard: '@gift_card_small'
    type: 'purchase'
    amount: 500
  gift_card_transaction_depleted_purchase:
    giftCard: '@gift_card_depleted'
    type: 'purchase'
    amount: 2000
  gift_card_transaction_depleted_redemption:
    giftCard: '@gift_card_depleted'
    type: 'redemption'
    amount: -2000
  gift_card_transaction_expired:
    giftCard: '@gift_card_expired'
    type: 'purchase'
    amount: 2000

AppBundle\Entity\GiftCard\GiftCardPurchaseCharge:
  gift_card_charge_active:
    __construct:
      - '@gift_card_active'
      - 'ch_gift_card_active'
      - 5000
      - 'EUR'
  gift_card_charge_small:
    __construct:
      - '@gift_card_small'
      - 'ch_gift_card_small'
      - 500
      - 'EUR'
