name: Run CoopCycle Web

inputs:
  wait-for-webpack:
    description: >
      Wait for the first webpack build to finish. Only needed by jobs that render
      pages including the Encore entrypoints (the e2e suite). The API test suites do
      not, and waiting costs ~2.5 minutes.
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
  - name: Create .env file
    shell: bash
    run: |
      cp .env.dist .env
  - name: Pull Docker images
    shell: bash
    run: docker compose pull --ignore-pull-failures
  # Downloading the extract and running extract/partition/customize takes ~4 minutes,
  # and the result only changes when the OSRM version or the profile changes — both of
  # which are pinned by docker/osrm/Dockerfile, so it is part of the cache key.
  - name: Restore OSRM data
    id: osrm-cache
    uses: actions/cache@v4
    with:
      path: var/osrm
      key: osrm-paris-france-${{ hashFiles('docker/osrm/Dockerfile') }}
  - name: Prepare OSRM data
    if: steps.osrm-cache.outputs.cache-hit != 'true'
    shell: bash
    run: |
      curl --create-dirs -o var/osrm/data.osm.pbf https://coopcycle-assets.sfo2.digitaloceanspaces.com/osm/paris-france.osm.pbf
      docker compose run -T --rm osrm osrm-extract -p /opt/bicycle.lua /data/data.osm.pbf
      docker compose run -T --rm osrm osrm-partition /data/data.osrm
      docker compose run -T --rm osrm osrm-customize /data/data.osrm
      # osrm-routed only reads data.osrm* (see docker/osrm/start.sh), so the ~180 MB
      # source extract does not need to be carried around in the cache.
      docker compose run -T --rm osrm rm -f /data/data.osm.pbf
  - name: Start PHP
    shell: bash
    # Alone first: the worker shares its code and its cache, and boots the app as soon as
    # php is started, while php still installs the dependencies and clears the cache.
    # Specify -f docker-compose.yml explicitly, because we don't want to load docker-compose.override.yml
    run: docker compose -f docker-compose.yml up -d php
  - name: Wait for PHP-FPM
    shell: bash
    # Until it is healthy, rather than the 3 healthchecks after which "up" gives up on it,
    # but not once its startup script has failed, which stops it
    run: |
      until docker inspect --format='{{ .State.Health.Status }}' $(docker compose ps -q php) | grep -wq healthy; do
        if [ "$(docker inspect --format='{{ .State.Running }}' $(docker compose ps -a -q php))" != "true" ]; then
          echo "The php container has stopped"
          exit 1
        fi
        sleep 5
      done
  - name: Start Docker containers
    shell: bash
    run: docker compose -f docker-compose.yml up -d
  - name: Wait webpack
    if: inputs.wait-for-webpack == 'true'
    shell: bash
    run: until [ -f "web/build/entrypoints.json" ]; do sleep 5; done
  - name: Create database
    shell: bash
    run: docker compose exec -T php bin/console doctrine:schema:create --env=test
  - name: Create typesense collections
    shell: bash
    run: docker compose exec -T php bin/console typesense:create --env=test
  - name: Validate database schema
    shell: bash
    run: docker compose exec -T php bin/console doctrine:schema:validate --env=test --skip-sync
  - name: Show the PHP logs
    if: failure()
    shell: bash
    # What the startup script printed, which the steps above don't show
    run: docker compose -f docker-compose.yml logs --no-color --tail=200 php php_worker
